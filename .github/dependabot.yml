version: 2
updates:
  # Keep GitHub Actions versions fresh. Grouped weekly so maintenance stays
  # visible without producing one PR per action.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

  # Cargo dependency updates for the workspace, monthly.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
