[workspace]
members = [
    "crates/rars",
    "crates/rars-cli",
    "crates/rars-codec",
    "crates/rars-crypto",
    "crates/rars-format",
    "crates/rars-recovery",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bitplane/rars"
